<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>브롤 퀴즈</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="icon" href="https://cdn.brawlify.com/brawlers/borders/16000000.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <!-- 홈 화면 -->
    <section id="home" class="screen active">
      <header class="logo">
        <img id="logo-brawler" alt="">
        <h1>브롤 퀴즈</h1>
        <p class="tagline">진짜 브롤 마스터를 가려라!</p>
      </header>
      <div id="difficulty" class="difficulty" role="radiogroup" aria-label="난이도"></div>
      <p id="difficulty-desc" class="difficulty-desc"></p>
      <div class="best">최고 점수 <strong id="best-score">0</strong></div>
      <div id="mode-list" class="mode-list"></div>
    </section>

    <!-- 퀴즈 화면 -->
    <section id="quiz" class="screen">
      <div class="hud">
        <button id="quit" class="btn-icon" aria-label="그만하기">✕</button>
        <div class="progress"><span id="q-num">1</span> / <span id="q-total">10</span></div>
        <div class="score">⭐ <span id="score">0</span></div>
      </div>
      <div class="timer"><div id="timer-bar"></div></div>
      <div id="streak" class="streak"></div>
      <h2 id="question" class="question"></h2>
      <div id="stage" class="stage"></div>
      <div id="choices" class="choices"></div>
      <div id="feedback" class="feedback"></div>
      <button id="next" class="btn-primary hidden">다음 ▶</button>
    </section>

    <!-- 결과 화면 -->
    <section id="result" class="screen">
      <h2 class="result-title" id="result-title"></h2>
      <img id="result-brawler" class="result-brawler" alt="">
      <div class="result-score"><span id="final-score">0</span>점</div>
      <div class="result-sub" id="result-sub"></div>
      <div id="new-best" class="new-best hidden">🏆 최고 기록 갱신!</div>
      <div class="result-actions">
        <button id="retry" class="btn-primary">다시 하기</button>
        <button id="home-btn" class="btn-secondary">모드 선택</button>
      </div>
      <h3 class="review-title">문제 다시 보기</h3>
      <ul id="review" class="review"></ul>
    </section>
  </main>
  <footer class="credit">
    팬메이드 비영리 퀴즈입니다. 브롤스타즈 및 관련 이미지는 Supercell의 자산이며, 데이터·이미지는
    <a href="https://brawlify.com" target="_blank" rel="noopener">Brawlify</a>에서 제공합니다.
  </footer>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
